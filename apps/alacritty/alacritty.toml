# Los colores ya no van aquí: se generan en ~/.config/alacritty/colors.toml
# a partir del tema activo en quickshell/services/Theme.qml (ver Theme.qml,
# alacrittyText()). Cambia de tema desde el icono de la paleta en la barra y
# Alacritty recarga solo (live_config_reload está activado por defecto).
general.import = ["~/.config/alacritty/colors.toml"]
